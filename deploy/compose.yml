services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: flowdesk:0.1.1
    command: ["--profile", "server", "--listen", "0.0.0.0:8080", "--no-browser", "--trusted-proxy-cidrs", "172.30.24.2/32"]
    environment:
      FLOWDESK_PUBLIC_ORIGIN: "https://${FLOWDESK_HOST:?set FLOWDESK_HOST}"
    volumes:
      - flowdesk_data:/data
    networks:
      backend:
        ipv4_address: 172.30.24.3
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 15s
  gateway:
    image: caddy:2.10.2-alpine
    environment:
      FLOWDESK_HOST: "${FLOWDESK_HOST:?set FLOWDESK_HOST}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      backend:
        ipv4_address: 172.30.24.2
    depends_on: [app]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
volumes:
  flowdesk_data:
  caddy_data:
  caddy_config:
networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.24.0/24
# Single instance/local volume. Change network and exact proxy CIDR together if it conflicts.
# No automatic restart loop before offline initialization.

